<h2>Lineaarinen regressiomalli</h2>
<p>Syötä regressiomallin parametrit ja x-arvo. Malli laskee ennusteen kaavalla:</p>
<p><strong>y = a + b · x</strong></p>

<label>a (vakiotermi):</label><br>
<input id="inputA" type="number" step="0.1"><br><br>

<label>b (kulmakerroin):</label><br>
<input id="inputB" type="number" step="0.1"><br><br>

<label>x (syöte):</label><br>
<input id="inputX" type="number" step="0.1"><br><br>

<label>Valitse x‑muuttuja datasta:</label><br>
<select id="xSelect">
  <option value="time_s" selected>time_s</option>
  <option value="accuracy_m">accuracy_m</option>
  <option value="altitude_m">altitude_m</option>
  <option value="distance_m">distance_m</option>
</select><br><br>

<label>Valitse y‑muuttuja datasta:</label><br>
<select id="ySelect">
  <option value="distance_m">distance_m</option>
  <option value="altitude_m" selected>altitude_m</option>
  <option value="accuracy_m">accuracy_m</option>
  <option value="time_s">time_s</option>
</select><br><br>

<button onclick="useDataForRegression()">Laske regressio datasta</button>
<br><br>

<button onclick="predict()">Laske ennuste</button>

function useDataForRegression() {
    const xKey = document.getElementById("xSelect").value;
    const yKey = document.getElementById("ySelect").value;

    const xs = data.map(row => row[xKey]);
    const ys = data.map(row => row[yKey]);

    const { a, b } = linearRegression(xs, ys);

    document.getElementById("inputA").value = a.toFixed(4);
    document.getElementById("inputB").value = b.toFixed(4);

    document.getElementById("regressionResult").innerText =
        `Regressio laskettu: a = ${a.toFixed(4)}, b = ${b.toFixed(4)}`;
}

// Laske lineaarinen regressio (OLS)
function linearRegression(xs, ys) {
    const n = xs.length;
    const meanX = xs.reduce((a,b)=>a+b)/n;
    const meanY = ys.reduce((a,b)=>a+b)/n;

    let num = 0, den = 0;
    for (let i=0; i<n; i++) {
        num += (xs[i] - meanX) * (ys[i] - meanY);
        den += (xs[i] - meanX) ** 2;
    }

    const b = num / den;
    const a = meanY - b * meanX;
    return { a, b };
}

function predict() {
    const a = parseFloat(document.getElementById("inputA").value);
    const b = parseFloat(document.getElementById("inputB").value);
    const x = parseFloat(document.getElementById("inputX").value);

    if (isNaN(a) || isNaN(b) || isNaN(x)) {
        document.getElementById("result").innerText = "Anna kelvolliset numerot kaikkiin kenttiin.";
        return;
    }

    const y = a + b * x;
    document.getElementById("result").innerText = "Ennuste y = " + y.toFixed(3);
    
}
